<!DOCTYPE html>
<html lang="cz">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="problem.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kontakt.css">
    <script src="https://kit.fontawesome.com/7b01b6ae72.js" crossorigin="anonymous"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem</title>
</head>
<body>
    <header>
        <h1>Problém</h1>
        <ul class="menu">
            <li class="neaktivni"><a href="index.html">Domů</a></li>
            <li class="neaktivni"><a href="tutorialy.html">Tutoriáli</a></li>
            <li class="neaktivni"><a href="galerie.html">Galerie</a></li>
            <li class="neaktivni"><a href="kontakt.html">Kontak</a></li>
            <li class="momentalne"><a href="problem.html"><i class="fa-solid fa-triangle-exclamation problem"></i></a></li>
        </ul>
        
    </header>

    <section>
        <div class="logo">
            <h1>Problém</h1>
            <p><strong>Omlouvám se, ale stránka, kterou hledáte, neexistuje.</strong></p>
        </div>

        <div class="boxik">
            <div class="realBox">
                <div class="buxusy">
                    <div class="ultra-bux">
                        <div class="blox-super">
                            <h1>Máš problém?</h1>
                            <p>Napiš co tě trápí nebo chceš změnit na této stránce</p>
                            <input type="email" class="inputy" placeholder="Tvůj email">
                            <input type="text" class="inputy" placeholder="Zde napiš svoji připomínku">
                            <button class="tlacitecko">Odeslat</button>
                        </div>
                        

                    </div>

                </div>
            </div>

        </div>
    </section>

    <footer>
        <p>vytvořil <strong>Jakub Němec</strong> všechna práva vyhrazena</p>
    </footer>

    <script>
        window.addEventListener("scroll", function () {
            const header = document.querySelector("header");
            if (window.scrollY > 50) {
                header.classList.add("shrink");
            } else {
                header.classList.remove("shrink");
            }
        });
    </script>
</body>
</html>
